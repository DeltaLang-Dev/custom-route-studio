<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ByWay - Custom Route Builder</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      background: #090d16; color: #f1f5f9; overflow: hidden; 
    }
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Top Sleek HUD */
    .nav-hud {
      display: none; position: absolute; top: 16px; left: 14px; right: 14px; z-index: 1000;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 14px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); max-width: 460px; margin: 0 auto;
    }
    .nav-hud-step { font-size: 15px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .nav-hud-dist { font-size: 13px; color: #10b981; margin-top: 4px; font-weight: 600; }

    /* Frosted Glass Bottom Sheet */
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(11, 15, 25, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      padding: 12px 18px 26px; max-width: 500px; margin: 0 auto;
      max-height: 80vh; overflow-y: auto;
    }
    .sheet-handle {
      width: 36px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 4px;
      margin: 0 auto 10px;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .app-brand { display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .header-row h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.3px; color: #ffffff; }
    .stats { font-size: 13px; font-weight: 700; color: #94a3b8; }

    /* Glass Eco Dashboard */
    .eco-bar {
      display: flex; gap: 8px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 14px; padding: 10px 14px; margin: 10px 0; justify-content: space-around;
    }
    .eco-metric { text-align: center; }
    .eco-val { font-size: 14px; font-weight: 800; color: #34d399; letter-spacing: -0.2px; }
    .eco-label { font-size: 9px; text-transform: uppercase; color: #6ee7b7; font-weight: 700; margin-top: 2px; }

    /* Mode Selector Pills */
    .mode-pills {
      display: flex; gap: 6px; margin: 10px 0; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none;
    }
    .mode-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex: 1; min-width: 60px; padding: 9px 8px; font-size: 11px; font-weight: 700;
      text-align: center; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.04); cursor: pointer; color: #94a3b8; white-space: nowrap;
      transition: all 0.2s ease;
    }
    .pill.active { 
      background: #ffffff; color: #090d16; border-color: #ffffff; 
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); 
    }
    .pill-add { 
      background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); 
    }

    /* Buttons */
    .btn-grid { display: flex; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 11px 8px; border-radius: 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: none; text-align: center; transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-green { 
      background: linear-gradient(135deg, #10b981, #059669); color: #ffffff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }
    .btn-main { background: rgba(255, 255, 255, 0.08); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-sub { background: rgba(255, 255, 255, 0.04); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.06); }
    
    .loading { font-size: 11px; color: #38bdf8; text-align: center; display: none; margin: 4px 0; }
    .alert-banner { font-size: 12px; color: #34d399; text-align: center; display: none; margin-top: 6px; font-weight: 600; }

    /* Cue Sheet Directions */
    .directions-list {
      margin-top: 12px; max-height: 180px; overflow-y: auto; border-top: 1px solid rgba(255, 255, 255, 0.08); 
      padding-top: 10px; display: none;
    }
    .direction-step {
      font-size: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #cbd5e1;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 2000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; 
      width: 100%; max-width: 340px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .modal h4 { margin: 0 0 12px; font-size: 16px; font-weight: 800; color: #fff; }
    .modal label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .modal input, .modal select {
      width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.05);
      color: #fff; font-size: 13px; font-family: inherit;
    }
    .modal select option { background: #111827; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Navigation HUD -->
  <div class="nav-hud" id="navHud">
    <div class="nav-hud-step" id="hudInstruction">🏁 Start Route</div>
    <div class="nav-hud-dist" id="hudDistance">Begin navigation</div>
  </div>

  <div id="map"></div>

  <!-- Bottom Control Sheet -->
  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="header-row">
      <div class="app-brand">
        <div class="brand-dot"></div>
        <h3>ByWay</h3>
      </div>
      <div class="stats" id="stats">0.00 mi</div>
    </div>

    <!-- Eco Metrics Dashboard -->
    <div class="eco-bar">
      <div class="eco-metric">
        <div class="eco-val" id="co2Saved">0.0 lbs</div>
        <div class="eco-label">CO₂ Offset</div>
      </div>
      <div class="eco-metric">
        <div class="eco-val" id="cashSaved">$0.00</div>
        <div class="eco-label">Gas Saved</div>
      </div>
      <div class="eco-metric">
        <div class="eco-val" id="ecoShare">100%</div>
        <div class="eco-label">Clean Ride</div>
      </div>
    </div>

    <div class="mode-pills" id="modeSelector">
      <div class="pill active" data-mode="foot">Walk</div>
      <div class="pill" data-mode="bike">Bike</div>
      <div class="pill" data-mode="transit">Transit</div>
      <div class="pill" data-mode="driving">Drive</div>
      <div class="pill" data-mode="offgrid">Off-Grid</div>
      <div class="pill pill-add" id="addCustomModeBtn">+ Custom</div>
    </div>

    <div class="loading" id="loading">Routing path...</div>

    <div class="btn-grid">
      <button class="btn btn-green" id="startNavBtn">Start Nav</button>
      <button class="btn btn-sub" id="toggleDirectionsBtn">Turns</button>
      <button class="btn btn-sub" id="shareBtn">Share</button>
      <button class="btn btn-sub" id="clearBtn">Reset</button>
    </div>
    
    <div class="btn-grid" style="margin-top: 6px;">
      <button class="btn btn-main" id="exportGpxBtn">Export .GPX</button>
    </div>

    <div class="alert-banner" id="alertBanner">Link copied to clipboard!</div>

    <!-- Cue Sheet -->
    <div class="directions-list" id="directionsList"></div>
  </div>

  <!-- Custom Mode Dialog -->
  <div class="modal-overlay" id="customModal">
    <div class="modal">
      <h4>Add Commute Mode</h4>
      <label>Mode Name</label>
      <input type="text" id="customName" placeholder="Skateboard, Scooter, Rollerblade..." maxlength="15" />
      
      <label>Routing Network</label>
      <select id="customRouteType">
        <option value="bike">Paved Trails & Bike Corridors</option>
        <option value="foot">Pedestrian Paths & Sidewalks</option>
        <option value="offgrid">Off-Grid Freeform Line</option>
      </select>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-green" id="saveCustomMode">Add</button>
        <button class="btn btn-sub" id="cancelCustomMode">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize map with high-contrast CartoDB Dark Matter tiles
    const map = L.map('map', { zoomControl: false }).setView([32.7555, -97.3308], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap, &copy; Stadia Maps'
    }).addTo(map);

    // Neon high-contrast palette
    const modeColors = {
      foot: '#10b981',     // Neon emerald
      bike: '#06b6d4',     // Cyan
      transit: '#f59e0b',  // Amber
      driving: '#ef4444',  // Crimson
      offgrid: '#a855f7'   // Violet
    };

    let activeMode = 'foot';
    let customModesRegistry = {};
    let historyPoints = [];
    let rawRouteCoordinates = [];
    let allManeuvers = [];
    let distanceByMode = { foot: 0, bike: 0, transit: 0, driving: 0, offgrid: 0 };
    let totalDistanceMeters = 0;
    let userLocationMarker = null;
    let navWatchId = null;

    function attachPillListeners() {
      document.querySelectorAll('.pill:not(.pill-add)').forEach(pill => {
        pill.onclick = () => {
          document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          activeMode = pill.getAttribute('data-mode');
        };
      });
    }
    attachPillListeners();

    const modal = document.getElementById('customModal');
    document.getElementById('addCustomModeBtn').onclick = () => { modal.style.display = 'flex'; };
    document.getElementById('cancelCustomMode').onclick = () => { modal.style.display = 'none'; };

    document.getElementById('saveCustomMode').onclick = () => {
      const name = document.getElementById('customName').value.trim();
      const routeType = document.getElementById('customRouteType').value;
      if (!name) return;

      const modeKey = 'custom_' + Date.now();
      const colorList = ['#38bdf8', '#ec4899', '#f97316', '#a3e635', '#e879f9'];
      const randomColor = colorList[Object.keys(customModesRegistry).length % colorList.length];

      modeColors[modeKey] = randomColor;
      customModesRegistry[modeKey] = { name, routeType };
      distanceByMode[modeKey] = 0;

      const newPill = document.createElement('div');
      newPill.className = 'pill active';
      newPill.setAttribute('data-mode', modeKey);
      newPill.innerText = name;

      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      const addBtn = document.getElementById('addCustomModeBtn');
      addBtn.parentNode.insertBefore(newPill, addBtn);

      activeMode = modeKey;
      attachPillListeners();
      modal.style.display = 'none';
      document.getElementById('customName').value = '';
    };

    async function getRouteSegment(coord1, coord2, modeType) {
      let profile = (modeType === 'bike') ? 'bike' : (modeType === 'driving') ? 'driving' : 'foot';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${coord1.lng},${coord1.lat};${coord2.lng},${coord2.lat}?overview=full&geometries=geojson&steps=true`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        let steps = [];
        if (route.legs && route.legs[0] && route.legs[0].steps) {
          steps = route.legs[0].steps.map(s => ({
            instruction: formatManeuver(s.maneuver, s.name),
            distance: s.distance
          }));
        }
        return {
          coords: route.geometry.coordinates.map(c => [c[1], c[0]]),
          distance: route.distance,
          steps: steps
        };
      }
      return null;
    }

    function formatManeuver(maneuver, streetName) {
      const name = streetName || "path";
      const type = maneuver.type;
      const modifier = maneuver.modifier || "";

      let icon = "⬆️";
      if (modifier.includes("left")) icon = "⬅️";
      if (modifier.includes("right")) icon = "➡️";
      if (type === "depart") return `🏁 Start on ${name}`;
      if (type === "arrive") return `🎯 Arrive at destination`;
      if (type === "turn") return `${icon} Turn ${modifier} onto ${name}`;
      if (type === "continue" || type === "new name") return `⬆️ Continue on ${name}`;
      return `${icon} ${type} onto ${name}`;
    }

    function renderDirectionsList() {
      const list = document.getElementById('directionsList');
      list.innerHTML = '';
      if (!allManeuvers.length) {
        list.innerHTML = '<div style="font-size:12px; color:#64748b; text-align:center;">Plot points on the map to see maneuvers.</div>';
        return;
      }
      allManeuvers.forEach((step, idx) => {
        const mi = (step.distance * 0.000621371).toFixed(2);
        const div = document.createElement('div');
        div.className = 'direction-step';
        div.innerHTML = `<span>${idx + 1}. ${step.instruction}</span><b style="color:#10b981;">${mi > 0 ? mi + ' mi' : ''}</b>`;
        list.appendChild(div);
      });
    }

    function updateEcoDashboard() {
      const totalMiles = totalDistanceMeters * 0.000621371;
      let zeroEmissionMeters = distanceByMode.foot + distanceByMode.bike + distanceByMode.offgrid;
      Object.keys(customModesRegistry).forEach(k => {
        zeroEmissionMeters += (distanceByMode[k] || 0);
      });

      const zeroEmissionMiles = zeroEmissionMeters * 0.000621371;
      const transitMiles = (distanceByMode.transit || 0) * 0.000621371;

      const gramsSaved = (zeroEmissionMiles * 404) + (transitMiles * 264);
      const lbsCo2Saved = gramsSaved / 453.592;
      const dollarsSaved = (zeroEmissionMiles * 0.128) + (transitMiles * 0.08);
      const ecoPercentage = totalMiles > 0 ? Math.round(((zeroEmissionMiles + transitMiles) / totalMiles) * 100) : 100;

      document.getElementById('co2Saved').innerText = `${lbsCo2Saved.toFixed(1)} lbs`;
      document.getElementById('cashSaved').innerText = `$${dollarsSaved.toFixed(2)}`;
      document.getElementById('ecoShare').innerText = `${ecoPercentage}%`;
      document.getElementById('stats').innerText = `${totalMiles.toFixed(2)} mi (${historyPoints.length} pts)`;
    }

    async function addWaypoint(latlng, mode, updateUrl = true) {
      const loading = document.getElementById('loading');
      const pointColor = modeColors[mode] || '#ffffff';

      // Modern pulsing node marker
      L.circleMarker(latlng, { 
        radius: 6, color: pointColor, fillColor: '#090d16', fillOpacity: 1, weight: 3 
      }).addTo(map);

      historyPoints.push({ lat: latlng.lat, lng: latlng.lng, mode });

      if (historyPoints.length === 1) {
        rawRouteCoordinates.push([latlng.lat, latlng.lng]);
        allManeuvers.push({ instruction: "🏁 Start route", distance: 0 });
      } else {
        const prev = historyPoints[historyPoints.length - 2];
        let legDistance = 0;
        
        let routingProfile = mode;
        if (customModesRegistry[mode]) {
          routingProfile = customModesRegistry[mode].routeType;
        }

        if (routingProfile === 'offgrid') {
          L.polyline([[prev.lat, prev.lng], [latlng.lat, latlng.lng]], { 
            color: pointColor, weight: 4, dashArray: '6, 8', opacity: 0.9 
          }).addTo(map);
          rawRouteCoordinates.push([latlng.lat, latlng.lng]);
          legDistance = L.latLng(prev.lat, prev.lng).distanceTo(latlng);
          allManeuvers.push({ instruction: "🧭 Head off-grid to next waypoint", distance: legDistance });
        } else {
          try {
            loading.style.display = 'block';
            const segment = await getRouteSegment({ lat: prev.lat, lng: prev.lng }, latlng, routingProfile);
            loading.style.display = 'none';
            if (segment) {
              // Glowing polyline
              L.polyline(segment.coords, { 
                color: pointColor, 
                weight: 5, 
                opacity: 0.9,
                dashArray: mode === 'transit' ? '8, 8' : null
              }).addTo(map);
              rawRouteCoordinates.push(...segment.coords);
              legDistance = segment.distance;
              if (segment.steps) allManeuvers.push(...segment.steps);
            }
          } catch {
            loading.style.display = 'none';
            L.polyline([[prev.lat, prev.lng], [latlng.lat, latlng.lng]], { color: '#64748b', weight: 3, dashArray: '4, 4' }).addTo(map);
            rawRouteCoordinates.push([latlng.lat, latlng.lng]);
            legDistance = L.latLng(prev.lat, prev.lng).distanceTo(latlng);
          }
        }

        distanceByMode[mode] = (distanceByMode[mode] || 0) + legDistance;
        totalDistanceMeters += legDistance;
      }

      updateEcoDashboard();
      renderDirectionsList();
      if (updateUrl) window.location.hash = encodeURIComponent(JSON.stringify(historyPoints));
    }

    map.on('click', (e) => addWaypoint(e.latlng, activeMode));

    document.getElementById('toggleDirectionsBtn').addEventListener('click', () => {
      const list = document.getElementById('directionsList');
      list.style.display = list.style.display === 'block' ? 'none' : 'block';
      renderDirectionsList();
    });

    document.getElementById('startNavBtn').addEventListener('click', () => {
      if (rawRouteCoordinates.length < 2) return alert('Plot a route first!');
      const hud = document.getElementById('navHud');
      const btn = document.getElementById('startNavBtn');

      if (navWatchId) {
        navigator.geolocation.clearWatch(navWatchId);
        navWatchId = null;
        hud.style.display = 'none';
        btn.innerText = 'Start Nav';
        btn.className = 'btn btn-green';
      } else {
        hud.style.display = 'block';
        btn.innerText = 'End Nav';
        btn.className = 'btn btn-main';

        if (allManeuvers.length > 0) {
          document.getElementById('hudInstruction').innerText = allManeuvers[0].instruction;
          const mi = (allManeuvers[0].distance * 0.000621371).toFixed(2);
          document.getElementById('hudDistance').innerText = mi > 0 ? `In ${mi} miles` : 'Begin navigation';
        }

        navWatchId = navigator.geolocation.watchPosition(pos => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          if (!userLocationMarker) {
            userLocationMarker = L.circleMarker(latlng, { radius: 8, color: '#38bdf8', fillColor: '#0284c7', fillOpacity: 0.9, weight: 3 }).addTo(map);
          } else {
            userLocationMarker.setLatLng(latlng);
          }
          map.setView(latlng, 17);
        }, err => console.log(err), { enableHighAccuracy: true });
      }
    });

    document.getElementById('exportGpxBtn').addEventListener('click', () => {
      if (rawRouteCoordinates.length < 2) return alert('Add at least 2 points first!');
      let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="ByWay"><trk><name>ByWay Commute</name><trkseg>`;
      rawRouteCoordinates.forEach(pt => { gpx += `<trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>`; });
      gpx += `</trkseg></trk></gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `byway_route_${Date.now()}.gpx`;
      link.click();
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      if (!historyPoints.length) return alert('Build a route first!');
      navigator.clipboard.writeText(window.location.href).then(() => {
        const b = document.getElementById('alertBanner');
        b.style.display = 'block';
        setTimeout(() => b.style.display = 'none', 2500);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      window.location.hash = '';
      location.reload();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.location.hash.length > 1) {
        try {
          const points = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
          if (points.length) {
            map.setView([points[0].lat, points[0].lng], 14);
            for (const pt of points) await addWaypoint(L.latLng(pt.lat, pt.lng), pt.mode, false);
          }
        } catch (e) {}
      } else {
        navigator.geolocation?.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 14));
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    }
  </script>
</body>
</html>
