<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Custom Route Studio</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Bottom Control Sheet */
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #ffffff; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
      padding: 12px 18px 24px; transition: transform 0.3s ease;
      max-width: 500px; margin: 0 auto;
    }
    .sheet-handle {
      width: 40px; height: 4px; background: #ddd; border-radius: 2px;
      margin: 0 auto 10px; cursor: pointer;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .header-row h3 { margin: 0; font-size: 16px; font-weight: 700; color: #111; }
    .stats { font-size: 13px; font-weight: 600; color: #2ecc71; }

    /* Mode Selector Pills */
    .mode-pills {
      display: flex; gap: 6px; margin: 10px 0; overflow-x: auto; padding-bottom: 4px;
    }
    .pill {
      flex: 1; min-width: 65px; padding: 8px 4px; font-size: 11px; font-weight: 600;
      text-align: center; border-radius: 8px; border: 1px solid #ddd;
      background: #f8f9fa; cursor: pointer; color: #444; white-space: nowrap;
    }
    .pill.active { background: #111; color: #fff; border-color: #111; }

    /* Buttons */
    .btn-grid { display: flex; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; text-align: center;
    }
    .btn-main { background: #111; color: #fff; }
    .btn-sub { background: #eee; color: #333; }
    .loading { font-size: 11px; color: #3498db; text-align: center; display: none; margin: 4px 0; }
    .alert-banner { font-size: 11px; color: #27ae60; text-align: center; display: none; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="header-row">
      <h3>Route Studio</h3>
      <div class="stats" id="stats">0.00 mi</div>
    </div>

    <div class="mode-pills" id="modeSelector">
      <div class="pill active" data-mode="foot">Walk</div>
      <div class="pill" data-mode="bike">Bike</div>
      <div class="pill" data-mode="driving">Drive</div>
      <div class="pill" data-mode="custom">Off-Grid</div>
    </div>

    <div class="loading" id="loading">Tracing streets...</div>

    <div class="btn-grid">
      <button class="btn btn-main" id="exportGpxBtn">Save .GPX</button>
      <button class="btn btn-sub" id="shareBtn">Share</button>
      <button class="btn btn-sub" id="clearBtn">Reset</button>
    </div>
    <div class="alert-banner" id="alertBanner">Link copied to clipboard!</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([32.7555, -97.3308], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const modeColors = {
      foot: '#2ecc71',
      bike: '#3498db',
      driving: '#e67e22',
      custom: '#9b59b6'
    };

    let activeMode = 'foot';
    let historyPoints = [];
    let rawRouteCoordinates = [];
    let totalDistanceMeters = 0;

    // Mode selection pill clicks
    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeMode = pill.getAttribute('data-mode');
      });
    });

    async function getRouteSegment(coord1, coord2, mode) {
      let profile = mode === 'bike' ? 'bike' : mode === 'driving' ? 'driving' : 'foot';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${coord1.lng},${coord1.lat};${coord2.lng},${coord2.lat}?overview=full&geometries=geojson`;
      const response = await fetch(url);
      if (!response.ok) return null;
      const data = await response.json();
      if (data.routes && data.routes.length > 0) {
        return {
          coords: data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]),
          distance: data.routes[0].distance
        };
      }
      return null;
    }

    async function addWaypoint(latlng, mode, updateUrl = true) {
      const loading = document.getElementById('loading');
      L.circleMarker(latlng, { radius: 5, color: modeColors[mode], fillColor: '#fff', fillOpacity: 1, weight: 3 }).addTo(map);
      historyPoints.push({ lat: latlng.lat, lng: latlng.lng, mode });

      if (historyPoints.length === 1) {
        rawRouteCoordinates.push([latlng.lat, latlng.lng]);
      } else {
        const prev = historyPoints[historyPoints.length - 2];
        if (mode === 'custom') {
          L.polyline([[prev.lat, prev.lng], [latlng.lat, latlng.lng]], { color: modeColors[mode], weight: 4, dashArray: '6, 8' }).addTo(map);
          rawRouteCoordinates.push([latlng.lat, latlng.lng]);
          totalDistanceMeters += L.latLng(prev.lat, prev.lng).distanceTo(latlng);
        } else {
          try {
            loading.style.display = 'block';
            const segment = await getRouteSegment({ lat: prev.lat, lng: prev.lng }, latlng, mode);
            loading.style.display = 'none';
            if (segment) {
              L.polyline(segment.coords, { color: modeColors[mode], weight: 5, opacity: 0.85 }).addTo(map);
              rawRouteCoordinates.push(...segment.coords);
              totalDistanceMeters += segment.distance;
            }
          } catch {
            loading.style.display = 'none';
            L.polyline([[prev.lat, prev.lng], [latlng.lat, latlng.lng]], { color: '#999', weight: 3, dashArray: '4, 4' }).addTo(map);
            rawRouteCoordinates.push([latlng.lat, latlng.lng]);
          }
        }
      }

      const mi = (totalDistanceMeters * 0.000621371).toFixed(2);
      document.getElementById('stats').innerText = `${mi} mi (${historyPoints.length} pts)`;
      if (updateUrl) window.location.hash = encodeURIComponent(JSON.stringify(historyPoints));
    }

    map.on('click', (e) => addWaypoint(e.latlng, activeMode));

    document.getElementById('exportGpxBtn').addEventListener('click', () => {
      if (rawRouteCoordinates.length < 2) return alert('Add at least 2 points first!');
      let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="CustomRouteStudio"><trk><name>Custom Commute</name><trkseg>`;
      rawRouteCoordinates.forEach(pt => { gpx += `<trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>`; });
      gpx += `</trkseg></trk></gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `route_${Date.now()}.gpx`;
      link.click();
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      if (!historyPoints.length) return alert('Build a route first!');
      navigator.clipboard.writeText(window.location.href).then(() => {
        const b = document.getElementById('alertBanner');
        b.style.display = 'block';
        setTimeout(() => b.style.display = 'none', 2500);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      window.location.hash = '';
      location.reload();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.location.hash.length > 1) {
        try {
          const points = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
          if (points.length) {
            map.setView([points[0].lat, points[0].lng], 14);
            for (const pt of points) await addWaypoint(L.latLng(pt.lat, pt.lng), pt.mode, false);
          }
        } catch (e) {}
      } else {
        navigator.geolocation?.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 14));
      }
    });
  </script>
</body>
</html>
